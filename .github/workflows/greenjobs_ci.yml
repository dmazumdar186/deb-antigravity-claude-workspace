name: greenjobs-ci

# GreenJobs (client) gate 1 of 3: on every push / PR touching GreenJobs paths. Fail fast:
# SAST + secret scan + config check on the changed files first, then every offline test tier.
# A green run on main triggers greenjobs-cd-staging (workflow_run). Nothing here calls Cloudflare.

on:
  push:
    paths:
      - "execution/gtm_client_workflows/greenjobs_redesign/**"
      - "deliverables/greenjobs_migration_2026-11-06/**"
      - "deliverables/greenjobs_redesign_2026-09-22/src/**"
      - "tests/greenjobs_redesign/**"
      - ".github/workflows/greenjobs_*.yml"
  pull_request:
    paths:
      - "execution/gtm_client_workflows/greenjobs_redesign/**"
      - "deliverables/greenjobs_migration_2026-11-06/**"
      - "deliverables/greenjobs_redesign_2026-09-22/src/**"
      - "tests/greenjobs_redesign/**"
      - ".github/workflows/greenjobs_*.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: greenjobs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Changed GreenJobs files
        id: changed
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          base="${BASE_PR:-$BASE_PUSH}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"   # new branch / dispatch: scan everything
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- \
            execution/gtm_client_workflows/greenjobs_redesign deliverables/greenjobs_migration_2026-11-06 \
            tests/greenjobs_redesign .github/workflows > "$RUNNER_TEMP/changed.txt" || true
          grep -E '(greenjobs|^\.github/workflows/greenjobs_)' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/gj.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/gj.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/gj.txt"

      - name: Secret scan (changed files)
        if: steps.changed.outputs.count != '0'
        run: |
          mapfile -t files < "$RUNNER_TEMP/gj.txt"
          python execution/gtm_client_workflows/greenjobs_redesign/deploy/release.py scan-secrets "${files[@]}"

      - name: SAST (workspace scanner, ruff + semgrep + native rules) on changed Python
        if: steps.changed.outputs.count != '0'
        run: |
          grep -E '\.py$' "$RUNNER_TEMP/gj.txt" > "$RUNNER_TEMP/py.txt" || true
          if [ ! -s "$RUNNER_TEMP/py.txt" ]; then echo "no changed Python"; exit 0; fi
          python -m pip install --quiet ruff semgrep
          mapfile -t files < "$RUNNER_TEMP/py.txt"
          python execution/infrastructure/workspace_sast.py --files "${files[@]}"

      - name: Syntax check changed JavaScript
        if: steps.changed.outputs.count != '0'
        run: |
          grep -E '\.(m?js)$' "$RUNNER_TEMP/gj.txt" | while read -r f; do node --check "$f"; done

      - name: Release config matches wrangler.toml (both environments)
        run: python execution/gtm_client_workflows/greenjobs_redesign/deploy/release.py check-config

  tests:
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Python packages and wrangler (a Dependabot PR tests its own bump here)
        run: |
          python -m pip install --quiet -r execution/gtm_client_workflows/greenjobs_redesign/requirements-greenjobs.txt
          npm ci --prefix execution/gtm_client_workflows/greenjobs_redesign/platform_worker

      - name: Offline test pack (schema, import, apply mode, Gaia, Worker, BDD, no-CSV)
        env:
          PYTHON: python
        run: bash deliverables/greenjobs_migration_2026-11-06/build/run_tests.sh

      - name: Release pipeline + smoke client tests (mock, no network)
        run: python -m pytest tests/greenjobs_redesign/smoke -q
