name: prodcraft-medspa-replies

# Every 30 minutes: advance -> scan_replies -> takedown (no drafts). Meets the 1-hour takedown SLA
# mechanically (Amodei #1, docs/audits/prodcraft_medspa_panel_pass_2026-09-10.md D4). Inert until
# the operator flips the `PRODCRAFT_CRON_ENABLED` repo variable to "true" — see
# directives/personal_workflows/prodcraft_medspa_pipeline.md for the one-time setup this depends on
# (Supabase project + schema, R2 bucket, Worker deploy, Gmail OAuth token, Telegram channel).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: prodcraft-medspa-replies
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replies:
    if: vars.PRODCRAFT_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily.py --replies-only
        env:
          PRODCRAFT_STORE: supabase
          PRODCRAFT_ENV: github-actions
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FINDYMAIL_API_KEY: ${{ secrets.FINDYMAIL_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          MILLION_VERIFIER_API_KEY: ${{ secrets.MILLION_VERIFIER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PREVIEW_BASE_DOMAIN: ${{ secrets.PREVIEW_BASE_DOMAIN }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_MIRROR_ID: ${{ secrets.GOOGLE_SHEETS_MIRROR_ID }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}
        run: |
          python execution/personal_workflows/prodcraft_medspa/scripts/daily.py --replies-only

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODCRAFT_ENV: github-actions
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from execution.personal_workflows.prodcraft_medspa.common import notify
          notify.error('prodcraft_medspa_replies', 'GitHub Actions run failed — see workflow run for details', 1)
          "
