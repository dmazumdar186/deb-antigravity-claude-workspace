  format: json
  fields:
  - name: clients
    label: Companies
    type: object
    fields:
    - name: name
      label: Company name
      type: string
    - name: logo
      label: Logo
      type: image
      description: Pick the logo from Media > logos. PNG or SVG, transparent background is best.
    - name: url
      label: Website link (optional)
      type: string
      description: The company website, starting with https://. Can stay empty.
    - name: monogram
      label: Text shown if there is no logo (optional)
      description: Only used when there is no logo, for example "SP". Can stay empty.
      type: string
    list: true
- name: reviews
  label: Reviews (stars and comments)
  description: Every review shown on the site. Add, change or delete reviews and their stars here. Shared by French and English.
  type: file
  path: src/content/reviews-seed.json
  format: json
  fields:
  - name: reviews
    label: Reviews
    type: object
    list: true
    fields:
    - name: name
      label: Name of the person
      type: string
    - name: rating
      label: Stars (1 to 5)
      description: Type a number from 1 to 5.
      type: number
      options:
        min: 1
        max: 5
    - name: body
      label: Review text
      type: text
    - name: lang
      label: Language of the review
      type: select
      options:
        values:
        - value: fr
          label: French
        - value: en
          label: English
    - name: body_fr
      label: French translation (optional)
      description: Only if the review is in English and you want a French version. Can stay empty.
      type: text
    - name: body_en
      label: English translation (optional)
      description: Only if the review is in French and you want an English version. Can stay empty.
      type: text
    - name: source
      label: Where the review comes from
      type: select
      options:
        values:
        - value: google
          label: Google
        - value: superprof
          label: Superprof
        - value: email
          label: Email / message
        - value: other
          label: Other
    - name: source_url
      label: Link to the original review (optional)
      type: string
    - name: submitted_at
      label: Date of the review
      description: 'Format: 2026-07-14 (year-month-day).'
      type: string
    - name: featured
      label: Show first
      description: Tick to put this review at the top.
      type: boolean
    - name: verified
      label: Real review I received
      description: Leave ticked for real reviews.
      type: boolean
    - name: approved_at
      label: Date added (technical)
      type: string
      hidden: true
    - name: id
      label: ID (technical)
      type: string
      hidden: true
    - name: google_reviewer_photo
      label: Google photo (technical)
      type: string
      hidden: true
    - name: google_update_time
      label: Google date (technical)
      type: string
      hidden: true
    - name: edited_at
      label: Edited (technical)
      type: string
      hidden: true
    - name: date_backfill_source
      label: Date source (technical)
      type: string
      hidden: true
