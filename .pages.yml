# Pages CMS configuration - log in at https://app.pagescms.org with GitHub.
# DO NOT EDIT unless you are a developer: a mistake here breaks the editor.
media:
  input: public/assets
  output: /assets
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
  - gif
  - svg
  - mp4
  - webm
  - mov
  - mp3
  - m4a
content:
- name: site
  label: Ambient sound (site settings)
  description: The background flute music. Upload a new MP3 to Media > audio, pick it here, set the volume (0 = silent, 1 = loudest) or switch it off.
  type: file
  path: src/content/site.json
  format: json
  fields:
  - name: ambient_audio
    label: Ambient audio
    type: object
    fields:
    - name: enabled
      label: Play ambient music
      type: boolean
    - name: file
      label: Music file (MP3)
      type: file
    - name: volume
      label: Volume (0 to 1)
      type: number
- name: hero_fr
  label: Home page (French)
  description: Texts and photos of the "Home page" section in French. Edit the French and English versions separately.
  type: file
  path: src/content/hero.fr.json
  format: json
  fields:
  - name: eyebrow
    label: Small text above the title
    type: string
  - name: headline
    label: Headline
    type: string
  - name: subhead
    label: Text under the headline
    type: text
  - name: primary_cta
    label: Main button
    type: object
    fields:
    - name: label
      label: Text
      type: string
    - name: action
      label: Button link (do not change)
      type: string
      description: Where the button goes. Leave as it is.
  - name: secondary_cta
    label: Second button
    type: object
    fields:
    - name: label
      label: Text
      type: string
    - name: href
      label: Link
      type: string
      description: A web address (https://...). Leave as it is if unsure.
  - name: featured_in_label
    label: Title above the press names
    type: string
  - name: featured_in
    label: Press names
    type: string
    list: true
  - name: clients_label
    label: Title above the company logos
    type: string
  - name: clients_caption
    label: Short sentence under the title, above the logos
    description: One sentence shown under "Ils m'ont fait confiance" / "They trusted me".
    type: text
  - name: hero_image
    label: Big photo at the top
    type: image
  - name: hero_image_alt
    label: Big photo description
    type: string
    description: A few words saying what the photo shows.
  - name: portrait_image
    label: Your portrait photo
    type: image
  - name: portrait_alt
    label: Portrait description
    type: string
    description: A few words saying what the photo shows.
