<style>

    padding:90px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left}
  .grain{position:absolute;inset:0;opacity:0.05;mix-blend-mode:multiply;pointer-events:none}
  .wordmark{font-size:34px;font-weight:600;
    letter-spacing:0.06em;color:#3a2e25;z-index:2}
  .mid{display:flex;flex-direction:column;gap:30px;z-index:2;align-items:flex-start;text-align:left}

  .sub{font-size:30px;font-weight:400;line-height:1.45;

  .attr{font-size:22px;color:#8a7a67;font-style:italic}
  .bottom{display:flex;width:100%;flex-direction:row;align-items:center;justify-content:space-between;z-index:2}
  .cta{display:inline-block;font-size:27px;font-weight:600;
    background:#3a2e25;color:#f2e9dc;padding:16px 42px;
    border-radius:999px;border:none}
  .footer{font-size:23px;color:#8a7a67}
