<h1>ProdCraft · weekly cards · batch 1 (weeks 1–10)</h1>
<p>PNGs are 1080×1350 (4:5), LinkedIn image-post ready, under 5 MB each. <a href="prodcraft_weekly_cards_batch1.zip" download>Download all (zip)</a> · <a href="contact_sheet.png">contact sheet</a> · 10 cards</p>
<div class="grid"><figure><img src="png/01_week_before_you_automate_it_follow_one.png" width="540" height="675" alt="week 01" loading="lazy"><figcaption><b>wk 01</b> · Product judgment <span class="m">minimal_editorial</span><p class="cap"><b>Angle</b> Tell a short story about shadowing a real workflow before deciding what to automate. Show the steps and the surprise.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/01_week_before_you_automate_it_follow_one.png" download>Download PNG</a></figcaption></figure><figure><img src="png/02_week_a_sent_email_is_an_activity.png" width="540" height="675" alt="week 02" loading="lazy"><figcaption><b>wk 02</b> · Outbound systems <span class="m">annotated_workflow</span><p class="cap"><b>Angle</b> Explain how replies get classified, routed and followed up. Keep volume separate from qualified opportunities.</p><p class="cap"><b>CTA</b> Ask a practical question, not “agree?”</p><p class="cap"><b>Guardrail</b> none</p><a href="png/02_week_a_sent_email_is_an_activity.png" download>Download PNG</a></figcaption></figure><figure><img src="png/03_week_an_ai_demo_works_on_the.png" width="540" height="675" alt="week 03" loading="lazy"><figcaption><b>wk 03</b> · AI reliability <span class="m">failure_checklist</span><p class="cap"><b>Angle</b> Share three failure cases you now test before trusting an AI workflow. Do not invent an incident; use real examples from your work.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/03_week_an_ai_demo_works_on_the.png" download>Download PNG</a></figcaption></figure><figure><img src="png/04_week_if_a_human_still_copies_the.png" width="540" height="675" alt="week 04" loading="lazy"><figcaption><b>wk 04</b> · Operations <span class="m">annotated_workflow</span><p class="cap"><b>Angle</b> Map a before/after handoff without claiming time savings you have not measured.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/04_week_if_a_human_still_copies_the.png" download>Download PNG</a></figcaption></figure><figure><img src="png/05_week_i_moved_closer_to_the_code.png" width="540" height="675" alt="week 05" loading="lazy"><figcaption><b>wk 05</b> · Founder perspective <span class="m">founder_note</span><p class="cap"><b>Angle</b> Describe a real moment from your product career that changed how you work. Add a specific detail only you would know.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/05_week_i_moved_closer_to_the_code.png" download>Download PNG</a></figcaption></figure><figure><img src="png/06_week_not_every_ai_idea_deserves_an.png" width="540" height="675" alt="week 06" loading="lazy"><figcaption><b>wk 06</b> · AI product strategy <span class="m">annotated_workflow</span><p class="cap"><b>Angle</b> Give a decision test for choosing between rules, a workflow, RAG and an agent.</p><p class="cap"><b>CTA</b> Invite thoughtful counterexamples</p><p class="cap"><b>Guardrail</b> none</p><a href="png/06_week_not_every_ai_idea_deserves_an.png" download>Download PNG</a></figcaption></figure><figure><img src="png/07_week_a_voice_assistant_needs_to_know.png" width="540" height="675" alt="week 07" loading="lazy"><figcaption><b>wk 07</b> · Voice AI <span class="m">annotated_workflow</span><p class="cap"><b>Angle</b> Explain what a good human handoff should preserve: caller context, reason and transcript.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/07_week_a_voice_assistant_needs_to_know.png" download>Download PNG</a></figcaption></figure><figure><img src="png/08_week_bring_one_repetitive_task_not_a.png" width="540" height="675" alt="week 08" loading="lazy"><figcaption><b>wk 08</b> · Trust / offer <span class="m">offer_card</span><p class="cap"><b>Angle</b> Explain what happens in a ProdCraft discovery/build session and what you will not promise before scoping.</p><p class="cap"><b>CTA</b> Soft invitation</p><p class="cap"><b>Guardrail</b> Use this CTA only if the 30-minute session and described process are currently offered.</p><a href="png/08_week_bring_one_repetitive_task_not_a.png" download>Download PNG</a></figcaption></figure><figure><img src="png/09_week_a_roadmap_item_is_not_a.png" width="540" height="675" alt="week 09" loading="lazy"><figcaption><b>wk 09</b> · Product delivery <span class="m">before_after</span><p class="cap"><b>Angle</b> Show how you would rewrite a vague AI roadmap item as an observable user or business change.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/09_week_a_roadmap_item_is_not_a.png" download>Download PNG</a></figcaption></figure><figure><img src="png/10_week_a_workflow_without_an_owner_is.png" width="540" height="675" alt="week 10" loading="lazy"><figcaption><b>wk 10</b> · Operations <span class="m">annotated_workflow</span><p class="cap"><b>Angle</b> Walk through ownership across the workflow: trigger, automation, exception, human and audit trail.</p><p class="cap"><b>CTA</b> No CTA</p><p class="cap"><b>Guardrail</b> none</p><a href="png/10_week_a_workflow_without_an_owner_is.png" download>Download PNG</a></figcaption></figure></div></body></html>
