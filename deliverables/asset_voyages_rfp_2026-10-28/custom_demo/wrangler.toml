name = "asset-voyages-demo"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "asset-voyages-demo"
database_id = "b66464ee-8255-44c7-a6b0-55ef7285a9b2"

# Daily sandbox reset, 03:00 UTC (free tier: cron triggers are included).
[triggers]
crons = ["0 3 * * *"]

[vars]
PUBLIC_URL = "https://asset-voyages-demo.debanjan186.workers.dev"
# "off" for the public demo (shared accounts must never be locked for other visitors); "on" in production.
ACCOUNT_LOCKOUT = "off"
# SHA-256 of the test-suite key (the key itself lives only in the gitignored .dev.vars / CI env). A request carrying the
# key in x-demo-test is exempt from the per-IP caps (sandboxes, enquiries, wrong passwords; never per-browser, per-account
# or global), so a full test run behind one egress IP does not use up the demo for real visitors from that IP.
DEMO_TEST_KEY_SHA256 = "3e1d9495f8a1499f0e9da658b2bad6233af5b80f1dde6c40dcfa6c14d68bb648"
