name = "asset-voyages-demo"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "asset-voyages-demo"
database_id = "b66464ee-8255-44c7-a6b0-55ef7285a9b2"

# Daily sandbox reset, 03:00 UTC (free tier: cron triggers are included).
[triggers]
crons = ["0 3 * * *"]

[vars]
PUBLIC_URL = "https://asset-voyages-demo.debanjan186.workers.dev"
# "off" for the public demo (shared accounts must never be locked for other visitors); "on" in production.
ACCOUNT_LOCKOUT = "off"

# Preview: a separate Worker and database for independent testing (`npx wrangler deploy --env preview`).
# Nothing is shared with the client-facing Worker above: own name, own D1, own GME_KEY and DEMO_TEST_KEY secrets.
[env.preview]
name = "asset-voyages-demo-preview"
workers_dev = true
preview_urls = false

[[env.preview.d1_databases]]
binding = "DB"
database_name = "asset-voyages-demo-preview"
database_id = "1c329116-470c-4ba9-8e1c-41307e6b878c"

[env.preview.triggers]
crons = ["0 3 * * *"]

[env.preview.vars]
PUBLIC_URL = "https://asset-voyages-demo-preview.debanjan186.workers.dev"
ACCOUNT_LOCKOUT = "off"
