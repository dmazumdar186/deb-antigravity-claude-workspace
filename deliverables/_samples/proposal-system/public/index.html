<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proposals</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafaf7;
    color: #0f172a;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .box {
    max-width: 480px;
    text-align: center;
    padding: 48px 40px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  }
  h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { color: #475569; line-height: 1.6; margin: 0; }
  .accent { color: #d97706; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <h1>Your Company <span class="accent">Proposals</span></h1>
    <p>Private proposals. Access via direct link only.</p>
  </div>
</body>
</html>
