name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tier 1: SAST — must pass BEFORE build (catches untracked Functions).
      - name: SAST — untracked Pages Functions
        run: |
          untracked=$(git ls-files --others --exclude-standard functions/ 2>/dev/null | grep -E '\.(ts|js|mjs)$' || true)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked Pages Functions will not be shipped by wrangler pages deploy:"
            echo "$untracked"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Tier 2: Unit tests
      - name: Unit tests
        run: npm run test:unit

      # Tier 3: Build
      - name: Build
        run: npm run build

      # Tier 4: Deploy preview (main-branch push OR PR)
      - name: Deploy to Cloudflare Pages (preview)
        id: deploy
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=<PROJECT_NAME> --branch=${{ github.head_ref || github.ref_name }}

      # Tier 5: Acceptance gate against the preview URL
      - name: Acceptance gate (live)
        if: steps.deploy.outputs.deployment-url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}
        run: |
          py tests/acceptance_<PROJECT_NAME>.py || python tests/acceptance_<PROJECT_NAME>.py

      # Tier 6: Front-door synthetic
      - name: Front-door synthetic (live)
        if: steps.deploy.outputs.deployment-url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}
        run: bash tests/front_door_<PROJECT_NAME>.sh

  # Independent job: block merge on any failure via required-status-check.
  gate:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "::error::build-and-test did not succeed — main-branch merge blocked."
            exit 1
          fi
          echo "All gates passed."
