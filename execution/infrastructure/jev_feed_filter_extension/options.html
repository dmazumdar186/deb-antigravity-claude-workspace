<!doctype html>
<html><head><meta charset="utf-8"><title>Jev Feed Filter - Options</title>
<style>body{font:14px sans-serif;max-width:520px;margin:24px}label{display:block;margin:12px 0}input[type=password]{width:100%}</style>
</head><body>
<h2>Jev Feed Filter</h2>
<label>OpenRouter API key<input id="key" type="password" placeholder="sk-or-..."></label>
<label><input id="slop" type="checkbox"> Slop filter (X, LinkedIn)</label>
<label><input id="unclutter" type="checkbox"> Unclutter (ads, cookie banners on any page)</label>
<label>Threshold: <span id="tval">0.70</span><input id="threshold" type="range" min="0.5" max="0.99" step="0.01" value="0.7"></label>
<button id="save">Save</button> <span id="status"></span>
<script src="options.js"></script>
</body></html>
