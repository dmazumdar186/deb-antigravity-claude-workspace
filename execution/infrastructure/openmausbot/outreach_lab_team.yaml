version: 1
defaults:
  model: claude/claude-sonnet-5-5
  effort: low
  approval: auto
  computer: off
teams:
  - name: Outreach Lab
    brief: |
      We are ProdCraft, a small studio that builds websites and AI automations for small businesses.
      Work only from facts given in the job. Never invent client names, figures or quotes.
bots:
  - name: Lead
    team: Outreach Lab
    chief: true
    title: Outreach lead
    soul: |
      You own the job. Ask Skeptic to attack your draft once, revise once, then reply with the final text only.
  - name: Skeptic
    team: Outreach Lab
    title: Adversarial reviewer
    soul: |
      You attack drafts as the recipient would: list the 3 strongest objections (claims without evidence, hype, length). Be brief.
