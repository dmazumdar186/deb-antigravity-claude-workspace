name = "greenjobs-platform"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (never in this file):
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put BUILD_TOKEN

# Routes are added at go-live (README "Deploy"); staging uses the workers.dev host in HOST_SITE_MAP.
# Job pages are rendered by this Worker from D1 (ARCHITECTURE.md §3.1), so the board paths route here too;
# everything else (home, guides, assets) stays on Pages. Repeat each pattern for the www. host.
# routes = [
#   { pattern = "greenjobs.ie/api/*", zone_name = "greenjobs.ie" },
#   { pattern = "greenjobs.ie/admin*", zone_name = "greenjobs.ie" },
#   { pattern = "greenjobs.ie/jobs*", zone_name = "greenjobs.ie" },
#   { pattern = "greenjobs.ie/ie/jobs*", zone_name = "greenjobs.ie" },
#   { pattern = "greenjobs.ie/ie/sectors/*", zone_name = "greenjobs.ie" },
#   { pattern = "greenjobs.ie/sitemap-jobs.xml", zone_name = "greenjobs.ie" },
#   { pattern = "greenjobs.co.uk/api/*", zone_name = "greenjobs.co.uk" },
#   { pattern = "greenjobs.co.uk/admin*", zone_name = "greenjobs.co.uk" },
#   { pattern = "greenjobs.co.uk/jobs*", zone_name = "greenjobs.co.uk" },
#   { pattern = "greenjobs.co.uk/uk/jobs*", zone_name = "greenjobs.co.uk" },
#   { pattern = "greenjobs.co.uk/uk/sectors/*", zone_name = "greenjobs.co.uk" },
#   { pattern = "greenjobs.co.uk/sitemap-jobs.xml", zone_name = "greenjobs.co.uk" },
# ]
# Note: the /{site}/sectors/<slug>/ route must not shadow the static /{site}/sectors/index.html page: the
# Worker answers only /{site}/sectors/<slug>/ and passes /{site}/sectors/ (index.html) through to the origin.

[triggers]
crons = ["*/10 * * * *"]   # retries 'pending'/'failed' deliveries (dry run records 'dry_run')

[vars]
DRY_RUN = "1"              # live mail only when DRY_RUN="0" AND LIVE_CONFIRM="send-applications"
LIVE_CONFIRM = ""
HOST_SITE_MAP = '{"greenjobs.ie":"ie","www.greenjobs.ie":"ie","greenjobs.co.uk":"uk","www.greenjobs.co.uk":"uk","ie.greenjobs-platform.workers.dev":"ie","uk.greenjobs-platform.workers.dev":"uk"}'
ACCESS_TEAM_DOMAIN = ""    # e.g. "greenjobs.cloudflareaccess.com"
ACCESS_AUD = ""            # the Access application's AUD tag
STAFF_EMAILS = ""          # comma list; empty = nobody (fail closed)
ACCESS_SERVICE_TOKEN_IDS = "" # comma list of Access service-token Client IDs (JWT common_name) allowed on import + smoke paths only
APPLY_ROUTING = "inbox"    # inbox | consultant | advertiser: default for an email-mode job with no apply_email
APPLY_INBOX_IE = ""
APPLY_INBOX_UK = ""
MAIL_PROVIDER = "none"     # resend | none
MAIL_FROM = ""             # e.g. "GreenJobs <applications@greenjobs.ie>"
MAIL_DAILY_CAP = "200"     # budget guard: live sends per UTC day
OPS_ALERT_EMAIL = ""       # delivery-failure alert inbox; empty = audit_log row only, no alert mail
RATE_APPLY_PER_10MIN = "5"
RATE_ADMIN_PER_MIN = "60"
MAX_CV_BYTES = "5242880"
ROBOTS_INDEX = "0"         # "1" at go-live: job pages drop the demo shell's noindex so Google indexes JobPosting
CANONICAL_ORIGIN_IE = ""   # e.g. "https://www.greenjobs.ie"; empty = the request's own origin
CANONICAL_ORIGIN_UK = ""   # e.g. "https://www.greenjobs.co.uk"
ALERTS_ENABLED = "0"
NEWSLETTER_ENABLED = "0"
# Job alerts + newsletter (src/listmail/, migration 0004). Secret: wrangler secret put LIST_MAIL_SIGNING_KEY (>= 32 chars).
LIST_FROM_IE = ""          # e.g. "GreenJobs.ie <alerts@mail.greenjobs.ie>"; empty = never sent live
LIST_FROM_UK = ""          # e.g. "GreenJobs.co.uk <alerts@mail.greenjobs.co.uk>"
LIST_MAIL_RUN_CAP = "20"   # list mails per cron tick (and the */10 cron drains the weekly digest)
LIST_MAIL_DAILY_CAP = "100" # list mails per UTC day (also bounded by MAIL_DAILY_CAP)
LIST_DIGEST_HOUR_UTC = "7" # weekly digest opens Monday at this hour
RATE_ALERTS_PER_10MIN = "5"
FEED_IMPORT_ENABLED = "0"       # POST /api/admin/import writes only when "1" (Gaia feed: never promised for 3 Dec; dry runs always work)
IMPORT_MAX_CLOSE_SHARE = "0.5"  # a feed batch that would close more than this share of open feed jobs is refused (409)
EMPLOYER_POSTING_ENABLED = "0"  # /employer + /api/employer: phase 2 (CHM Recruit, Mattinson); "0" = 404
ALLOWED_ORIGINS = "https://greenjobs.ie,https://www.greenjobs.ie,https://greenjobs.co.uk,https://www.greenjobs.co.uk"

[[d1_databases]]
binding = "DB"
database_name = "greenjobs"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "CVS"
bucket_name = "greenjobs-cvs"

# Optional burst guard for /api/apply (period must be 10 or 60 s; the 10-minute window
# from RATE_APPLY_PER_10MIN still applies via KV or the in-isolate map).
# [[unsafe.bindings]]
# name = "APPLY_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }

# Optional KV for the fixed-window limiter (otherwise per-isolate, best effort).
# [[kv_namespaces]]
# binding = "RATE"
# id = "..."

# ── Release environments (deploy/ENVIRONMENTS.md, deploy/release.py) ─────────────────────────
# Wrangler does NOT inherit vars or bindings into an [env.*] section: each env repeats every var
# (deploy/release.py check-config fails if one is missing) and its own D1 / R2 bindings.
# The account comes from CLOUDFLARE_ACCOUNT_ID at deploy time (staging: ours; production: GreenJobs').

[env.staging]
name = "greenjobs-platform-staging"
workers_dev = true

[env.staging.vars]
DRY_RUN = "1"              # pinned: staging never sends mail (check-config enforces)
LIVE_CONFIRM = ""
HOST_SITE_MAP = '{"greenjobs-platform-staging.debanjan186.workers.dev":"ie"}'
ACCESS_TEAM_DOMAIN = ""    # staging Access team domain (staff console + smoke service token)
ACCESS_AUD = ""
STAFF_EMAILS = ""
ACCESS_SERVICE_TOKEN_IDS = ""
APPLY_ROUTING = "inbox"
APPLY_INBOX_IE = ""
APPLY_INBOX_UK = ""
MAIL_PROVIDER = "none"     # pinned: no mail provider on staging
MAIL_FROM = ""
MAIL_DAILY_CAP = "0"
OPS_ALERT_EMAIL = ""
RATE_APPLY_PER_10MIN = "5"
RATE_ADMIN_PER_MIN = "60"
MAX_CV_BYTES = "5242880"
ALERTS_ENABLED = "0"
NEWSLETTER_ENABLED = "0"
ROBOTS_INDEX = "0"         # pinned: staging is never indexed (Worker pages + Pages _headers X-Robots-Tag)
CANONICAL_ORIGIN_IE = ""
CANONICAL_ORIGIN_UK = ""
LIST_FROM_IE = ""
LIST_FROM_UK = ""
LIST_MAIL_RUN_CAP = "20"
LIST_MAIL_DAILY_CAP = "100"
LIST_DIGEST_HOUR_UTC = "7"
RATE_ALERTS_PER_10MIN = "5"
FEED_IMPORT_ENABLED = "0"
IMPORT_MAX_CLOSE_SHARE = "0.5"
EMPLOYER_POSTING_ENABLED = "0"
ALLOWED_ORIGINS = "https://greenjobs-staging-ie.pages.dev,https://greenjobs-staging-uk.pages.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "greenjobs-staging"
database_id = "d94a690a-286a-4608-b563-8329fdc37382"
migrations_dir = "../../../../deliverables/greenjobs_migration_2026-11-06/build/d1/migrations"

# [[env.staging.r2_buckets]]   # R2 not enabled on our account yet (environments.json _r2_note); CVs -> 503 on staging
# binding = "CVS"
# bucket_name = "greenjobs-cvs-staging"

[env.production]
name = "greenjobs-platform"
workers_dev = false
routes = [
  { pattern = "greenjobs.ie/api/*", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.ie/admin*", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.ie/employer*", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.ie/jobs*", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.ie/ie/jobs*", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.ie/ie/sectors/*", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.ie/sitemap-jobs.xml", zone_name = "greenjobs.ie" },
  { pattern = "greenjobs.co.uk/api/*", zone_name = "greenjobs.co.uk" },
  { pattern = "greenjobs.co.uk/admin*", zone_name = "greenjobs.co.uk" },
  { pattern = "greenjobs.co.uk/employer*", zone_name = "greenjobs.co.uk" },
  { pattern = "greenjobs.co.uk/jobs*", zone_name = "greenjobs.co.uk" },
  { pattern = "greenjobs.co.uk/uk/jobs*", zone_name = "greenjobs.co.uk" },
  { pattern = "greenjobs.co.uk/uk/sectors/*", zone_name = "greenjobs.co.uk" },
  { pattern = "greenjobs.co.uk/sitemap-jobs.xml", zone_name = "greenjobs.co.uk" },
]

[env.production.vars]
DRY_RUN = "1"              # flipping to "0" is a go-live decision with the operator's word (CUTOVER_RUNBOOK)
LIVE_CONFIRM = ""
HOST_SITE_MAP = '{"greenjobs.ie":"ie","www.greenjobs.ie":"ie","greenjobs.co.uk":"uk","www.greenjobs.co.uk":"uk"}'
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
STAFF_EMAILS = ""
ACCESS_SERVICE_TOKEN_IDS = ""
APPLY_ROUTING = "inbox"
APPLY_INBOX_IE = ""
APPLY_INBOX_UK = ""
MAIL_PROVIDER = "none"
MAIL_FROM = ""
MAIL_DAILY_CAP = "200"
OPS_ALERT_EMAIL = ""
RATE_APPLY_PER_10MIN = "5"
RATE_ADMIN_PER_MIN = "60"
MAX_CV_BYTES = "5242880"
ALERTS_ENABLED = "0"
NEWSLETTER_ENABLED = "0"
ROBOTS_INDEX = "1"         # production is indexed (go-live)
CANONICAL_ORIGIN_IE = ""   # set at go-live to the canonical host
CANONICAL_ORIGIN_UK = ""
LIST_FROM_IE = ""
LIST_FROM_UK = ""
LIST_MAIL_RUN_CAP = "20"
LIST_MAIL_DAILY_CAP = "100"
LIST_DIGEST_HOUR_UTC = "7"
RATE_ALERTS_PER_10MIN = "5"
FEED_IMPORT_ENABLED = "0"
IMPORT_MAX_CLOSE_SHARE = "0.5"
EMPLOYER_POSTING_ENABLED = "0"
ALLOWED_ORIGINS = "https://greenjobs.ie,https://www.greenjobs.ie,https://greenjobs.co.uk,https://www.greenjobs.co.uk"

[[env.production.d1_databases]]
binding = "DB"
database_name = "greenjobs"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "../../../../deliverables/greenjobs_migration_2026-11-06/build/d1/migrations"

[[env.production.r2_buckets]]
binding = "CVS"
bucket_name = "greenjobs-cvs"
