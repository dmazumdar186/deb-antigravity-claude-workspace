<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{product}} by {{brand}}</title>
<style>
{{theme_css}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55}
main{max-width:860px;margin:0 auto;padding:32px 20px}
.hero h1{font-size:clamp(28px,6vw,48px);line-height:1.15;margin:24px 0 12px}
.hero p,.hero ol{color:var(--muted);font-size:18px}
.cta{display:inline-block;background:var(--accent);color:#fff;padding:14px 22px;border-radius:var(--radius);text-decoration:none;font-weight:600;margin:12px 0 24px}
.cta:focus,button:focus,input:focus,select:focus{outline:3px solid var(--accent);outline-offset:2px}
section{margin:28px 0}
.proof,.faq,.form{background:var(--card);border-radius:var(--radius);padding:20px}
.logos{display:flex;flex-wrap:wrap;gap:18px;list-style:none;padding:0;color:var(--muted);font-weight:700}
.form{display:grid;gap:8px;max-width:420px}
.form input,.form select{padding:10px;border:1px solid var(--muted);border-radius:var(--radius);font:inherit}
.form button{padding:12px;background:var(--accent);color:#fff;border:0;border-radius:var(--radius);font:inherit;font-weight:600}
.site-footer{color:var(--muted);font-size:14px;margin-top:40px}
.site-footer a{color:var(--accent);margin-right:12px}
.jev-debug{position:fixed;bottom:0;left:0;right:0;background:#111;color:#0f0;font:12px monospace;padding:6px 10px;z-index:99}
</style>
</head>
<body>
<main>
{{hero}}
{{primary_cta}}
{{proof}}
{{form}}
{{faq}}
{{footer}}
</main>
{{debug}}
</body>
</html>
