<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jev chatbot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f4;color:#1c1917;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:#1c1917;color:#fafaf9;font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:720px;padding:10px 14px;border-radius:10px;line-height:1.45;white-space:pre-wrap}
.me{align-self:flex-end;background:#2563eb;color:#fff}
.bot{align-self:flex-start;background:#fff;border:1px solid #e7e5e4}
.meta{font-size:12px;color:#78716c;margin-top:6px}
.chip{display:inline-block;margin:4px 4px 0 0;padding:3px 9px;border-radius:12px;background:#e7e5e4;border:0;cursor:pointer;font-size:12px}
.chip:hover{background:#d6d3d1}
form{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e7e5e4}
input{flex:1;padding:10px;font-size:15px;border:1px solid #d6d3d1;border-radius:8px}
button[type=submit]{padding:10px 16px;border:0;border-radius:8px;background:#1c1917;color:#fff}
</style></head><body>
<header>Jev chatbot -- answers are verbatim passages, zero LLM calls</header>
<div id="log"></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Ask a question..." autofocus><button type="submit">Ask</button></form>
<script>
var log=document.getElementById('log');
function add(cls,text){var d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function ask(q){
  if(!q)return; add('me',q); var b=add('bot','...');
  fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})
  .then(function(r){return r.json();}).then(function(a){
    b.textContent=a.text;
    var m=document.createElement('div');m.className='meta';
    m.textContent=(a.source?a.source+'  p='+a.probability.toFixed(2)+'  ':'')+a.kind+'  '+a.latency_ms+' ms  $'+a.cost.toFixed(6);
    b.appendChild(m);
    if(a.alternatives&&a.alternatives.length){
      var w=document.createElement('div');w.className='meta';w.appendChild(document.createTextNode('Was this it? Other matches: '));
      a.alternatives.forEach(function(x){var c=document.createElement('button');c.className='chip';
        c.textContent=(x.heading||x.source)+' ('+x.probability.toFixed(2)+')';c.title=x.source;
        c.onclick=function(){ask(q+' -- '+(x.heading||x.source));};w.appendChild(c);});
      b.appendChild(w);}
  }).catch(function(e){b.textContent='Error: '+e;});
}
document.getElementById('f').onsubmit=function(e){e.preventDefault();var i=document.getElementById('q');ask(i.value.trim());i.value='';};
</script></body></html>
