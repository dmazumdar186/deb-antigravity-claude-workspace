<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2230;--ink2:#4a5468;--ink3:#5f6b7f;--line:#dfe3ea;--soft:#eef1f5;

*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#1c2230;color:#fff;position:sticky;top:0;z-index:30}
.top .brand{font-weight:600;letter-spacing:.2px}
.top .brand small{font-weight:400;opacity:.75;margin-left:6px}
.top .sp{flex:1}
.tbtn{background:transparent;color:#fff;border:1px solid #4a5468;border-radius:6px;padding:5px 10px}
.tbtn.on{background:#2f5bd3;border-color:#2f5bd3}
.seg{display:inline-flex;border:1px solid #4a5468;border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:5px 9px}
.seg button.on{background:#fff;color:#1c2230}
.wrap{display:grid;grid-template-columns:208px 1fr auto;min-height:calc(100vh - 52px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin:14px 10px 4px}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;cursor:pointer}
nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
nav a:hover{background:var(--soft)}
main{padding:18px 22px 120px;min-width:0}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--ink3);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 11px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:hover{filter:brightness(.97)}
input[type=text],textarea,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink)}
.nl{display:flex;gap:8px}.nl input{flex:1}
.steps{display:flex;gap:8px;margin-top:10px;font-size:13px}
.step{padding:3px 9px;border-radius:12px;background:var(--soft);color:var(--ink3)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.diff{display:none;margin-top:10px;font-size:13px;border-left:3px solid var(--acc);padding:6px 10px;background:var(--acc-soft);border-radius:0 6px 6px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.filter{border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px;background:#fff}
.filter .k{font-size:12px;color:var(--ink3)}
.filter .v{font-weight:600}
.and{font-size:11px;color:var(--ink3);margin:-3px 0 5px 10px}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--ink2);font-weight:500;white-space:nowrap}
.b-new{background:var(--pin-soft);color:var(--pin)}
.b-clean{background:var(--acc-soft);color:var(--acc)}
.b-sugg{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.lab-A{background:var(--ok-soft);color:var(--ok)}
.lab-B{background:var(--warn-soft);color:var(--warn)}
.lab-C{background:var(--bad-soft);color:var(--bad)}
.chipbtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px}
.chipbtn.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.exp{font-size:12.5px;margin-top:6px;display:none}
.exp.open{display:block}
.exp td{padding:2px 8px 2px 0}
.link{background:none;border:0;color:var(--acc);padding:0;text-decoration:underline}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
.t td{border-bottom:1px solid var(--soft);padding:6px 8px;vertical-align:top}
.t tr:hover td{background:#fafbfc}
.orig{display:block;font-size:11.5px;color:var(--ink3)}
.hide-orig .orig{display:none}
.tablewrap{overflow-x:auto;max-height:430px;overflow-y:auto}
#resTable .t{font-size:12.5px}#resTable .t th{white-space:normal;padding:6px 4px;hyphens:none;word-break:normal}#resTable .t td{padding:5px 4px}#resTable td.nw{white-space:nowrap}
#resTable:not(.hide-orig) td.hov{min-width:150px}
#dqQueue .t th{white-space:normal}
@media (max-width:1400px){aside{width:260px!important}.wrap{grid-template-columns:176px 1fr auto}main{padding:16px 14px 120px}}
.mut{color:var(--ink3);font-size:12px}
.banner{background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:9px 12px;margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:none;border:0;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink2)}
.tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .tr{width:34px;height:19px;border-radius:10px;background:#b9c1ce;position:relative;transition:.15s}
.switch .tr:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked+.tr{background:var(--acc)}
.switch input:checked+.tr:after{left:17px}
.two{display:grid;grid-template-columns:120px 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.two div{padding:8px 10px;border-bottom:1px solid var(--soft)}
.two .h{background:var(--soft);font-weight:600;font-size:12px;color:var(--ink2)}
.preview{border:1px dashed #9aa5b8;border-radius:8px;padding:12px;background:#fbfcfd}
.why li{margin-bottom:8px}
/* annotations */
aside{width:330px;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
body.noann aside{display:none}
.pin{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--pin);color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px;cursor:pointer;flex:none}
body.noann .pin{display:none}
.ann{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
.ann:hover,.ann.on{border-color:var(--pin);background:var(--pin-soft)}
.ann b{font-size:13px}
.ann .r{color:var(--ink3);font-size:11.5px;margin-top:3px}
.hl{outline:3px solid var(--pin)!important;outline-offset:3px;border-radius:6px;transition:outline .2s}
.tourhl{outline:3px solid #e0901c!important;outline-offset:4px;border-radius:6px;box-shadow:0 0 0 9999px rgba(20,25,35,.18)}
/* flags */
body.f-off-rel .f-rel{display:none!important}
body.f-off-nl .f-nl{display:none!important}
/* modal / toast / tour */
.modal-bg{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;width:min(640px,92vw);max-height:84vh;overflow:auto;padding:18px}
.modal h2{margin:0 0 10px;font-size:17px}
.variant{border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;background:#fafbfc}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:520px;background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:16px;overflow-y:auto;z-index:35;display:none}.drawer.open{display:block}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;font-size:12.5px}.grid3 h4{margin:0 0 6px;font-size:13px}.grid3 td{padding:2px 10px 2px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:60}
.tourcard{position:fixed;left:228px;bottom:18px;width:420px;background:#fff;border:2px solid #e0901c;border-radius:10px;padding:14px;z-index:40;display:none;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.tourcard h4{margin:0 0 6px;font-size:15px}
.tourcard p{margin:0 0 10px;font-size:13px;color:var(--ink2)}
.tourcard .ft{display:flex;align-items:center;gap:8px}
.tourcard .ft span{flex:1;color:var(--ink3);font-size:12px}
[title]{}
.phone{display:none}
@media (max-width:820px){html,body{overflow-x:hidden;max-width:100%}.top,.wrap,.tourcard,.drawer,.modal-bg,.toast{display:none!important}
.phone{display:block;min-height:100vh;background:var(--bg);padding:0 0 32px}
.phone .ph{background:#1c2230;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.phone .ph b{font-size:15px}
.phone .pb{padding:20px 16px;max-width:520px;margin:0 auto}
.phone h1{font-size:22px;margin:0 0 8px}.phone p{margin:0 0 18px;color:var(--ink2)}
.phone .cta{display:block;text-align:center;background:var(--acc);color:#fff;border-radius:8px;padding:13px 14px;text-decoration:none;font-weight:600;margin-bottom:10px}
.phone .sec{display:block;text-align:center;border:1px solid var(--line);background:#fff;color:var(--acc);border-radius:8px;padding:12px 14px;text-decoration:none;font-weight:600}
.phone ul{margin:22px 0 0;padding:0;list-style:none}.phone li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:14px}}
</style>
</head>

 ['lists','#fCity','1. One clean City filter','"London" groups 8 spellings, so nobody is missed. The list is sorted by members affected: top 5, then "+ 3 more".',()=>{S.spOpen=true;}],
 ['lists','#resHead','2. Three labels: 1 / 5 / 43','À jour 1 · À confirmer 5 · À réactiver 43, from the profile-update and login dates against 12 Oct 2026. Click a chip to filter.'],
 ['lists','#resTable','3. Clean by default','The table shows one clean city and country. Hover a cell to see what the member typed, e.g. "As typed: Londres (Royaume-Uni)".',()=>{S.orig=false;}],
 ['lists','#origSw','4. "Show as typed"','One switch, off by default, prints the member\'s original entry under every cleaned value.',()=>{S.orig=true;}],
 ['lists','#drawer','5. Member drawer','Member M0495: "London, UK" / Royaume-Uni as typed, London / United Kingdom as used. The label comes with its reason: updated 20 May 2023, 3 years ago → À confirmer.',()=>{S.orig=false;S.member='M0495';S.drawer=true;}],
 ['dq','#dqQueue','6. Review only the uncertain','To review · 2 items · 17 members: 9 countries inferred from the city, 8 members with no employer. One "Confirm all (17 members)"; auto-cleaned items stay collapsed.',()=>{S.flags.rel=true;S.autoOpen=false;}],
 ['dq','#dqDecide','7. Two choices, to confirm or overturn','Cleaned values help admins, with guard rails: as typed always reachable, suggestions confirmed, per-school changes logged and reversible, profiles never edited. The two design choices are shown on screen.']];
function placeCard(e){const c=$('#tourCard');c.style.display='block';const W=Math.min(260,innerWidth-32);c.style.width=W+'px';const H=c.offsetHeight,g=10,top=60,vw=innerWidth,vh=innerHeight;
 if(!e){c.style.left='228px';c.style.top=(vh-H-18)+'px';return;}const r=e.getBoundingClientRect();
 const sp={right:vw-r.right,left:r.left,below:vh-r.bottom,above:r.top-top};const fitX=k=>sp[k]>=W+g*2,fitY=k=>sp[k]>=H+g*2;
 let side=['right','left'].find(fitX)||['below','above'].find(fitY)||Object.keys(sp).sort((a,b)=>sp[b]-sp[a])[0];
 const cl=(v,a,b)=>Math.max(a,Math.min(b,v));let x,y;
 if(side==='right'){x=r.right+g;y=cl(r.top,top,vh-H-10);}else if(side==='left'){x=r.left-W-g;y=cl(r.top,top,vh-H-10);}
 else if(side==='below'){y=r.bottom+g;x=cl(r.left,10,vw-W-10);}else{y=r.top-H-g;x=cl(r.left,10,vw-W-10);}
 c.style.left=cl(x,4,vw-W-4)+'px';c.style.top=cl(y,56,vh-H-4)+'px';c.style.bottom='auto';c.dataset.side=side;}
addEventListener('resize',()=>{if(tour.cur)placeCard(document.querySelector(STEPS[tour.cur-1][1]));});
const tour=window.tour={count:STEPS.length,cur:0,
 go(n){n=Math.max(1,Math.min(STEPS.length,n|0));this.cur=n;const s=STEPS[n-1];S.drawer=false;if(s[4])s[4]();S.scr=s[0];render();
  document.querySelectorAll('.tourhl').forEach(e=>e.classList.remove('tourhl'));const e=document.querySelector(s[1]);if(e){e.classList.add('tourhl');if(s[1]!=='#drawer')e.scrollIntoView({block:e.offsetHeight>innerHeight-140?'start':'center',behavior:'instant'});}
  $('#tTitle').textContent=s[2];$('#tText').textContent=s[3];$('#tCount').textContent=`Step ${n}/${STEPS.length}`;$('#tNote').style.display=n===1?'block':'none';placeCard(e);$('#tNext').textContent=n===STEPS.length?'Done':'Next';$('#tPrev').disabled=n===1;$('#tourCard').style.display='block';},
 next(){this.go(this.cur+1);},prev(){this.go(this.cur-1);},
 close(){this.cur=0;$('#tourCard').style.display='none';document.querySelectorAll('.tourhl').forEach(e=>e.classList.remove('tourhl'));}};
const rr=render;render=function(){rr();if(tour.cur){const e=document.querySelector(STEPS[tour.cur-1][1]);if(e&&S.scr===STEPS[tour.cur-1][0])e.classList.add('tourhl');}};

 :{t:'Trusted Segments · Concept',p:'This concept is built for a laptop screen.',v:'Watch the walkthrough (under 90 seconds)',b:'How it gets built',l:['Cleaned values are visible to admins; the city and country the member typed are one hover away; no field a member typed is ever overwritten.','Uncertain clean-ups are marked "suggested" with one-click confirm.','Admins review only the exceptions.']};
 $('#phT').textContent=P.t;$('#phP').textContent=P.p;$('#phV').textContent=P.v;$('#phB').textContent=P.b;$('#phL').innerHTML=P.l.map(x=>`<li>${esc(x)}</li>`).join('');
 $('#pfr').classList.toggle('on',fr);$('#pen').classList.toggle('on',!fr);}
const q=new URLSearchParams(location.search);
render();
if(q.get('tour')==='1')tour.go(+q.get('step')||1);
})();
